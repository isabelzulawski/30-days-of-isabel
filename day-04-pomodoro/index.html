<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee8dd"><meta name="description" content="A quiet focus timer with illustrated focus and rest scenes."><title>focus time</title><link rel="stylesheet" href="style.css"></head><body><header><a href="https://thirty-days-isabel-field.calmpixie5.chatgpt.site/">↖ 30 days of isabel</a><div class="utilities"><button id="settingsBtn" aria-label="Timer settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M12 4v16M19 4v16M2 9h6M9 15h6M16 8h6"/></svg></button></div></header><main><div class="timer-layout"><h1>pomodoro timer</h1><section class="timer-card" aria-label="Pomodoro timer"><div class="modes" role="group" aria-label="Timer mode"><button data-mode="focus" class="active" aria-pressed="true">focus</button><button data-mode="short" aria-pressed="false">short rest</button><button data-mode="long" aria-pressed="false">long rest</button></div><div class="image-frame"><img id="modeImage" src="images/focus.jpg" alt="A squirrel carrying books into a tree hollow"></div><div class="time" id="time" aria-label="25 minutes remaining">25:00</div><div class="progress-track" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressFill"></div></div><div class="timer-controls"><button id="resetBtn" class="icon-btn" aria-label="Reset current timer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.5-5.8M17 2v5h-5"/></svg></button><button id="startBtn" class="start">start <span>▷</span></button><button id="skipBtn" class="icon-btn" aria-label="Skip to the next session"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 5 10 7-10 7ZM19 5v14"/></svg></button></div><div class="card-bottom"><div id="rounds" aria-label="0 of 4 focus rounds completed"></div><span id="roundLabel">round 1 of 4</span></div><p id="announcement" class="sr-only" role="status" aria-live="polite"></p></section></div></main><dialog id="settings"><form id="settingsForm"><button type="button" class="close" aria-label="Close settings">×</button><h2>timer settings</h2><p class="settings-intro">Choose your minutes. Saving starts a fresh, paused session.</p><div class="settings-grid"><label>focus<input id="focusMinutes" type="number" min="1" max="180" required></label><label>short rest<input id="shortMinutes" type="number" min="1" max="60" required></label><label>long rest<input id="longMinutes" type="number" min="1" max="120" required></label></div><label class="check"><input id="autoStart" type="checkbox"> start the next session automatically</label><p class="small">A long rest comes after every 4 completed focus sessions. Your timer saves in this browser.</p><button class="start save" type="submit">save settings</button><p id="settingsError" role="alert"></p></form></dialog><script type="module" src="app.js"></script></body></html>

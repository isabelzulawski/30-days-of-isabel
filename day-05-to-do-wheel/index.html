<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>what to do next</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBEEF3;
    --surface: #FFF8FA;
    --ink: #4A2233;
    --muted: #94667A;
    --line: #F1D2DE;
    --accent: #D94F86;
    --accent-ink: #FFFFFF;
    --s1: #F9C6D7; --s2: #F2A3BF; --s3: #FBDCE6; --s4: #EC8DB0; --s5: #F6B6CB; --s6: #FDE6EE;
    --seg-ink: #4A2233;
    --bubble-fill: #F7B3CD;
    --bubble-line: #8A2452;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #24141B; --surface: #321C26; --ink: #FBE4EC; --muted: #C597AA; --line: #4A2A38;
      --accent: #F48FB7; --accent-ink: #2A0F1B;
      --s1: #E7A1BA; --s2: #D9819F; --s3: #F2BCCD; --s4: #C96D8F; --s5: #E494B0; --s6: #F5CAD8;
      --seg-ink: #2A0F1B;
      --bubble-fill: #F6A9C7; --bubble-line: #6E1640;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #24141B; --surface: #321C26; --ink: #FBE4EC; --muted: #C597AA; --line: #4A2A38;
    --accent: #F48FB7; --accent-ink: #2A0F1B;
    --s1: #E7A1BA; --s2: #D9819F; --s3: #F2BCCD; --s4: #C96D8F; --s5: #E494B0; --s6: #F5CAD8;
    --seg-ink: #2A0F1B;
    --bubble-fill: #F6A9C7; --bubble-line: #6E1640;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Sniglet", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    min-height: 100vh;
  }
  main {
    max-width: 1160px;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 72px) 20px 48px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr);
    gap: clamp(28px, 5vw, 64px);
    align-items: start;
  }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .wheel-col { order: -1; }
  }
  .bubble, h1 {
    font-family: "Sniglet", "Montserrat", ui-rounded, system-ui, sans-serif;
    font-weight: 800;
    color: var(--bubble-fill);
    -webkit-text-stroke: 0.14em var(--bubble-line);
    paint-order: stroke fill;
    letter-spacing: 0.03em;
  }
  h1 {
    font-size: clamp(2.8rem, 7vw, 4.4rem);
    line-height: 1.1;
    margin: 0 0 28px;
  }
  .lede { color: var(--muted); margin: 0 0 28px; max-width: 32ch; }

  form { display: flex; gap: 8px; margin-bottom: 18px; }
  input[type="text"] {
    flex: 1; min-width: 0;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    font: inherit; font-weight: 500;
    cursor: pointer;
    border: none;
    border-radius: 14px;
    padding: 12px 18px;
    background: var(--accent);
    color: var(--accent-ink);
    transition: transform .1s, opacity .15s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 4px 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  li span.text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li.picked span.text { font-weight: 700; }
  .remove {
    background: none; color: var(--muted);
    padding: 4px 10px; border-radius: 10px; font-size: 1.2rem; line-height: 1;
  }
  .remove:hover { color: var(--ink); background: var(--surface); }
  .empty { color: var(--muted); padding: 14px 0; }
  .clear { margin-top: 14px; background: none; color: var(--muted); padding: 6px 0; font-size: .92rem; }
  .clear:hover { color: var(--ink); }

  .wheel-col { display: flex; flex-direction: column; align-items: center; }
  .wheel-wrap {
    position: relative;
    width: min(100%, 640px);
    aspect-ratio: 1;
  }
  .pointer {
    position: absolute; top: -6px; left: 50%;
    width: 0; height: 0;
    transform: translateX(-50%);
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 26px solid var(--accent);
    z-index: 2;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.15));
  }
  canvas {
    width: 100%; height: 100%;
    display: block;
    border-radius: 50%;
    will-change: transform;
  }
  .hub {
    position: absolute; top: 50%; left: 50%;
    width: 24%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    padding: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: "Sniglet", "Montserrat", ui-rounded, system-ui, sans-serif;
    font-weight: 800;
    color: var(--bubble-fill);
    -webkit-text-stroke: 0.14em var(--bubble-line);
    paint-order: stroke fill;
    letter-spacing: 0.03em;
    font-size: clamp(1.15rem, 3.2vw, 1.45rem);
    box-shadow: 0 0 0 6px var(--bg), 0 6px 18px rgba(0,0,0,.12);
    z-index: 3;
  }
  .hub:active { transform: translate(-50%, -50%) scale(.95); }

  .result {
    margin-top: 28px;
    text-align: center;
    min-height: 120px;
    max-width: 36ch;
  }
  .result .label { color: var(--muted); margin: 0 0 4px; }
  .result .task {
    font-family: "Sniglet", "Montserrat", ui-rounded, system-ui, sans-serif;
    font-size: clamp(1.8rem, 4.6vw, 2.4rem);
    font-weight: 800;
    letter-spacing: 0.03em;
    color: var(--bubble-fill);
    -webkit-text-stroke: 0.14em var(--bubble-line);
    paint-order: stroke fill;
    line-height: 1.15;
    margin: 0 0 16px;
    overflow-wrap: anywhere;
  }
  .result .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .result.show { animation: pop .35s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .result.show { animation: none; }
  }
</style>
</head>
<body>
<main>
  <section>
    <h1>what to do next</h1>

    <form id="addForm" autocomplete="off">
      <input type="text" id="taskInput" placeholder="Water the plants" maxlength="60" aria-label="New task">
      <button type="submit">Add</button>
    </form>

    <ul id="list"></ul>
    <button class="clear" id="clearBtn" type="button" hidden>Clear all</button>
  </section>

  <section class="wheel-col">
    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" aria-label="Task wheel"></canvas>
      <button class="hub" id="spinBtn" type="button">Spin</button>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
  </section>
</main>

<script>
(function () {
  var STORE = 'spin-the-list:tasks';
  var tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(STORE) || '[]'); if (!Array.isArray(tasks)) tasks = []; } catch (e) { tasks = []; }

  var listEl = document.getElementById('list');
  var form = document.getElementById('addForm');
  var input = document.getElementById('taskInput');
  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  var spinBtn = document.getElementById('spinBtn');
  var resultEl = document.getElementById('result');
  var clearBtn = document.getElementById('clearBtn');

  var rotation = 0;
  var spinning = false;
  var pickedIndex = -1;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function save() { try { localStorage.setItem(STORE, JSON.stringify(tasks)); } catch (e) {} }

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function palette() { return ['--s1','--s2','--s3','--s4','--s5','--s6'].map(css); }
  function colorFor(i, n) {
    var p = palette();
    var idx = i % p.length;
    // avoid the last slice matching the first one
    if (n > 1 && i === n - 1 && idx === 0) idx = 2;
    return p[idx];
  }

  function renderList() {
    listEl.innerHTML = '';
    if (!tasks.length) {
      var e = document.createElement('li');
      e.className = 'empty';
      e.textContent = 'Your list is empty. Add a task to get started.';
      listEl.appendChild(e);
    }
    tasks.forEach(function (t, i) {
      var li = document.createElement('li');
      if (i === pickedIndex) li.className = 'picked';
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = colorFor(i, tasks.length);
      var txt = document.createElement('span');
      txt.className = 'text';
      txt.textContent = t;
      var rm = document.createElement('button');
      rm.className = 'remove';
      rm.type = 'button';
      rm.setAttribute('aria-label', 'Remove ' + t);
      rm.textContent = '×';
      rm.addEventListener('click', function () { removeTask(i); });
      li.append(dot, txt, rm);
      listEl.appendChild(li);
    });
    clearBtn.hidden = tasks.length < 2;
    spinBtn.disabled = tasks.length < 2 || spinning;
  }

  function removeTask(i) {
    if (spinning) return;
    tasks.splice(i, 1);
    pickedIndex = -1;
    resultEl.innerHTML = '';
    save(); renderList(); drawWheel();
  }

  function fitText(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
    return text.trim() + '…';
  }

  function drawWheel() {
    var size = canvas.clientWidth;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr; canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var c = size / 2, r = size / 2 - 2;
    ctx.clearRect(0, 0, size, size);
    var n = tasks.length;
    var font = '"Sniglet", ui-rounded, system-ui, sans-serif';

    if (!n) {
      ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2);
      ctx.fillStyle = css('--surface'); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = css('--line'); ctx.stroke();
      return;
    }

    var seg = (Math.PI * 2) / n;
    var start = -Math.PI / 2;
    var fs = Math.max(12, Math.min(19, size / (n > 8 ? 30 : 24)));
    for (var i = 0; i < n; i++) {
      var a0 = start + i * seg, a1 = a0 + seg;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a0, a1); ctx.closePath();
      ctx.fillStyle = colorFor(i, n); ctx.fill();
      if (n > 1) { ctx.lineWidth = 2; ctx.strokeStyle = css('--bg'); ctx.stroke(); }

      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(a0 + seg / 2);
      ctx.fillStyle = css('--seg-ink');
      ctx.font = '800 ' + fs + 'px ' + font;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      var inner = r * 0.24 + 14;
      ctx.fillText(fitText(tasks[i], r - inner - 22), r - 16, 0);
      ctx.restore();
    }
  }

  function spin() {
    if (spinning || tasks.length < 2) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.innerHTML = '';
    pickedIndex = -1; renderList();

    var n = tasks.length;
    var segDeg = 360 / n;
    var pick = Math.floor(Math.random() * n);
    var jitter = (Math.random() - 0.5) * segDeg * 0.7;
    var targetMod = ((-(pick + 0.5) * segDeg + jitter) % 360 + 360) % 360;
    var curMod = ((rotation % 360) + 360) % 360;
    var delta = (targetMod - curMod + 360) % 360;
    var turns = reduceMotion ? 1 : 5 + Math.floor(Math.random() * 2);
    rotation += turns * 360 + delta;

    var dur = reduceMotion ? 600 : 4200;
    canvas.style.transition = 'transform ' + dur + 'ms cubic-bezier(.12,.67,.12,1)';
    canvas.style.transform = 'rotate(' + rotation + 'deg)';

    setTimeout(function () {
      spinning = false;
      pickedIndex = pick;
      renderList();
      showResult(pick);
    }, dur + 60);
  }

  function showResult(i) {
    resultEl.className = 'result';
    resultEl.innerHTML = '';
    var label = document.createElement('p'); label.className = 'label'; label.textContent = 'Your next task';
    var task = document.createElement('p'); task.className = 'task'; task.textContent = tasks[i];
    var actions = document.createElement('div'); actions.className = 'actions';
    var done = document.createElement('button'); done.type = 'button'; done.textContent = 'Mark as done';
    done.addEventListener('click', function () { removeTask(i); });
    var again = document.createElement('button'); again.type = 'button'; again.className = 'ghost'; again.textContent = 'Spin again';
    again.addEventListener('click', spin);
    actions.append(done, again);
    resultEl.append(label, task, actions);
    void resultEl.offsetWidth;
    resultEl.classList.add('show');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value.trim();
    if (!v || spinning) return;
    tasks.push(v);
    input.value = '';
    pickedIndex = -1;
    save(); renderList(); drawWheel();
    input.focus();
  });

  clearBtn.addEventListener('click', function () {
    if (spinning) return;
    tasks = []; pickedIndex = -1; resultEl.innerHTML = '';
    save(); renderList(); drawWheel();
  });

  spinBtn.addEventListener('click', spin);

  window.addEventListener('resize', drawWheel);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { renderList(); drawWheel(); });
  new MutationObserver(function () { renderList(); drawWheel(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  renderList();
  drawWheel();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWheel);
})();
</script>
</body>
</html>

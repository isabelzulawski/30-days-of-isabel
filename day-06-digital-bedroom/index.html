min-height:440px}.stat-label{font-size:14px}.stat-label small{display:none}.bubble{font-size:17px;top:12px;left:10px;right:10px}.actions{gap:6px}.action{font-size:14px;min-height:79px}.note{font-size:14px}}@media(max-width:520px){.device{padding:12px;margin:9px}.top{grid-template-columns:1fr 2.4fr 1fr}.title{font-size:17px;white-space:normal}.screen{display:flex;flex-direction:column-reverse}.room{min-height:375px}.sidebar{display:grid;grid-template-columns:1.7fr 1fr;gap:10px}.panel h2{padding:5px 10px;font-size:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.stat{margin:0}.blocks{gap:2px;padding-left:0}.block{width:14px;height:10px}.stat-label{font-size:13px;gap:3px}.level{padding:8px;font-size:15px;align-self:start}.note{display:none}.actions{grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.action{min-height:72px;flex-direction:row;gap:10px}.action svg{width:25px;height:25px}.bottom{font-size:11px}.avatar{bottom:9%}.bubble{max-width:300px}.title span{display:none}}@media(prefers-reduced-motion:reduce){.avatar,.particle{animation:none}.action:hover{transform:none}}

<script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='isabel-pixel-room-v1';let state={name:'isabel',hair:'#76503f',outfit:'#bd8cab',food:60,care:75,energy:65,joy:80,xp:0,last:Date.now(),studyEnd:null,restEnd:null},timer=null,playRound=null;
try{const data=JSON.parse(localStorage.getItem(key));if(data&&typeof data==='object'){for(const k of ['food','care','energy','joy','xp','last'])if(Number.isFinite(data[k]))state[k]=data[k];if(typeof data.name==='string')state.name=data.name.slice(0,18);for(const k of ['hair','outfit'])if(/^#[a-f0-9]{6}$/i.test(data[k]||''))state[k]=data[k];for(const k of ['studyEnd','restEnd'])if(Number.isFinite(data[k]))state[k]=data[k];}}catch{}
const elapsed=Math.min(8,Math.max(0,(Date.now()-state.last)/3600000));['food','energy','care'].forEach(k=>state[k]=Math.max(15,Math.min(100,state[k]-elapsed*3)));state.joy=Math.max(15,Math.min(100,state.joy));state.xp=Math.max(0,state.xp);
function save(){state.last=Date.now();try{localStorage.setItem(key,JSON.stringify(state));}catch{$('saveNote').textContent='saving unavailable in this browser';}}
const paths={food:'M5 2v8m4-8v8M2 2v8h10V2M7 10v20M23 2v28M23 2c-8 7-8 13 0 13',heart:'M16 28L3 16V7l5-4h5l3 5 3-5h5l5 4v9Z',game:'M6 9h20l5 16-5 4-7-7h-6l-7 7-5-4ZM9 12v10m-5-5h10m8-3h3m-3 6h3',book:'M16 6L3 3v23l13 4 13-4V3ZM16 6v24M7 10l5 1m-5 5 5 1m9-6 4-1m-4 7 4-1',moon:'M22 3C1 2-2 25 16 29c7 1 12-4 14-10C18 23 11 13 22 3Z',gear:'M12 2h8v5l4 2 5-1 3 7-4 3v4l2 5-7 4-4-4h-5l-4 3-7-5 2-5-1-4-4-4 4-7 5 1 3-1ZM16 12a6 6 0 1 0 0 12 6 6 0 0 0 0-12'};document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML='<svg viewBox="0 0 34 34" fill="#ebadc0" stroke="#655076" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="'+paths[el.dataset.icon]+'"/></svg>';});
function avatar(){
const c=$('avatar').getContext('2d');c.clearRect(0,0,64,96);c.imageSmoothingEnabled=false;
const skin='#f9dcbd',cream='#fff0d1',hair=state.hair,outfit=state.outfit;
const mix=(hex,other,t)=>{const n=parseInt(hex.slice(1),16),m=parseInt(other.slice(1),16);return '#'+[16,8,0].map(s=>Math.round(((n>>s)&255)*(1-t)+((m>>s)&255)*t).toString(16).padStart(2,'0')).join('');};
const edge=mix(hair,'#655076',.45),light=mix(hair,'#ffe0b0',.22),shade=mix(outfit,'#75617d',.25),highlight=mix(outfit,'#fff4d2',.25);
const r=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x,y,w,h);};
const p=(points,color)=>{c.fillStyle=color;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill();};
// A softly stepped round head and simple, fluffy hair.
p([[23,11],[41,11],[41,13],[47,13],[47,17],[51,17],[51,24],[54,24],[54,47],[52,47],[52,57],[47,57],[47,60],[17,60],[17,57],[12,57],[12,47],[10,47],[10,24],[13,24],[13,18],[17,18],[17,14],[23,14]],edge);
p([[23,13],[41,13],[41,15],[46,15],[46,19],[49,19],[49,26],[52,26],[52,46],[50,46],[50,55],[46,55],[46,58],[18,58],[18,55],[14,55],[14,46],[12,46],[12,26],[15,26],[15,20],[19,20],[19,16],[23,16]],hair);
r(18,20,3,8,light);r(22,16,15,2,light);r(15,34,2,12,light);r(47,38,2,12,light);
// Wide cheeks, two tiny eyes and a small smile.
p([[23,26],[41,26],[41,28],[45,28],[45,33],[47,33],[47,41],[45,41],[45,46],[41,46],[41,49],[23,49],[23,47],[19,47],[19,42],[17,42],[17,33],[19,33],[19,29],[23,29]],skin);
r(18,40,7,3,'#efb1b3');r(40,40,7,3,'#efb1b3');r(25,35,2,3,'#78575f');r(38,35,2,3,'#78575f');r(31,42,3,1,'#bd8886');
// A curved fringe and a tiny daisy clip.
p([[18,26],[21,20],[28,18],[40,19],[46,24],[46,32],[42,32],[42,28],[38,30],[34,27],[30,29],[26,26],[22,31],[18,31]],hair);
r(23,22,4,2,light);r(29,20,9,2,light);r(44,27,3,7,'#f3bed0');r(42,29,7,3,'#f3bed0');r(44,29,3,3,'#fff0c0');
// Little legs and soft shoes sit beneath an oversized sweater.
r(24,77,7,9,'#f5d2b2');r(35,77,7,9,'#f5d2b2');r(24,81,7,5,cream);r(35,81,7,5,cream);r(22,86,10,4,'#8f7187');r(34,86,10,4,'#8f7187');r(23,86,7,1,'#c79baa');r(36,86,7,1,'#c79baa');
r(28,48,9,5,skin);
p([[23,51],[42,51],[42,53],[47,53],[47,57],[50,57],[50,69],[47,69],[47,76],[43,76],[43,79],[21,79],[21,76],[17,76],[17,69],[14,69],[14,57],[18,57],[18,54],[23,54]],shade);
p([[23,53],[41,53],[41,55],[46,55],[46,59],[48,59],[48,67],[44,67],[44,75],[40,75],[40,77],[24,77],[24,75],[20,75],[20,67],[16,67],[16,59],[20,59],[20,56],[23,56]],outfit);
r(18,60,3,6,highlight);r(23,57,3,12,highlight);r(42,61,2,11,shade);r(23,74,19,2,shade);r(25,75,1,2,highlight);r(29,75,1,2,highlight);r(33,75,1,2,highlight);r(37,75,1,2,highlight);
p([[26,52],[29,51],[32,53],[35,51],[39,52],[38,55],[34,56],[30,56],[27,55]],cream);
// Small heart stitched onto the sweater.
p([[29,62],[31,62],[32,64],[33,62],[35,62],[35,65],[32,68],[29,65]],'#f0b7c7');
r(15,66,6,4,cream);r(44,66,5,4,cream);r(17,70,4,3,skin);r(44,70,4,3,skin);
}
function render(){const names={food:['♧','NOURISHED'],care:['✧','CARED FOR'],energy:['ϟ','ENERGY'],joy:['♡','HAPPY']};$('stats').replaceChildren();Object.entries(names).forEach(([k,[icon,label]])=>{const row=document.createElement('div');row.className='stat';row.innerHTML='<div class="stat-label"><span>'+icon+'</span><b>'+label+'</b><small>'+Math.round(state[k])+'%</small></div>';const blocks=document.createElement('div');blocks.className='blocks';blocks.setAttribute('role','meter');blocks.setAttribute('aria-label',label.toLowerCase());blocks.setAttribute('aria-valuemin','0');blocks.setAttribute('aria-valuemax','100');blocks.setAttribute('aria-valuenow',Math.round(state[k]));for(let i=0;i<5;i++){const b=document.createElement('span');b.className='block'+(state[k]>i*20?' on':'');blocks.append(b);}row.append(blocks);$('stats').append(row);});$('level').textContent='LV. '+String(1+Math.floor(state.xp/100)).padStart(2,'0');$('xpText').textContent='EXP '+state.xp%100+'/100';$('xpFill').style.width=state.xp%100+'%';$('worldTitle').textContent=state.name.toUpperCase()+"'S WORLD";const resting=!!state.restEnd;$('room').classList.toggle('resting',resting);$('room').classList.toggle('night',resting);$('mood').textContent=resting?'a little rest ☾':state.studyEnd?'one thing at a time ✎':'feeling cozy ♡';avatar();}
function say(text){$('bubble').textContent=text;}function reward(values,message){for(const[k,v]of Object.entries(values))state[k]=Math.max(0,Math.min(100,state[k]+v));state.xp+=10;save();render();say(message);sparkle();}function sparkle(){for(let i=0;i<5;i++){const p=document.createElement('span');p.className='particle';p.textContent=['♡','✧','✦'][i%3];p.style.left=(35+Math.random()*30)+'%';p.style.top=(45+Math.random()*20)+'%';$('room').append(p);setTimeout(()=>p.remove(),1600);}}
function modal(html){$('modalContent').innerHTML=html;$('modal').showModal();}function button(id,fn){$(id).onclick=fn;}function finishTimers(){const now=Date.now();if(state.studyEnd&&now>=state.studyEnd){state.studyEnd=null;reward({joy:15,energy:-5},'a little progress! close the books and stretch. ♡');}if(state.restEnd&&now>=state.restEnd){state.restEnd=null;reward({energy:25,joy:10},'welcome back. a little softer, a little recharged. ♡');}}function timerText(end){const n=Math.max(0,Math.ceil((end-Date.now())/1000));return Math.floor(n/60).toString().padStart(2,'0')+':'+(n%60).toString().padStart(2,'0');}
function timerModal(kind){const study=kind==='study',field=study?'studyEnd':'restEnd';modal('<h2>'+(study?'a little focus':'a little breathing room')+'</h2><p>'+(study?'pick one small thing. your pixel self will keep you company.':'look away from the screen. stretch, breathe, or close your eyes.')+'</p><div class="timer" id="timerValue"></div><div class="modal-buttons"><button class="btn" id="startTimer"></button><button class="btn alt" id="cancelTimer">'+(state[field]?'cancel session':'close')+'</button></div><div class="modal-status" id="timerStatus"></div>');const update=()=>{if(!$('timerValue'))return;$('timerValue').textContent=state[field]?timerText(state[field]):study?'25:00':'05:00';$('startTimer').textContent=state[field]?'session running…':'start '+(study?'25':'5')+' minutes';$('startTimer').disabled=!!state[field];$('cancelTimer').textContent=state[field]?'cancel session':'close';};update();clearInterval(timer);timer=setInterval(update,1000);button('startTimer',()=>{if(state.studyEnd||state.restEnd){$('timerStatus').textContent='finish or cancel your other session first. ♡';return;}state[field]=Date.now()+(study?25:5)*60000;save();render();say(study?'a little focus. you’ve got this, '+state.name+'.':'taking a tiny break. nothing to earn, just rest.');update();});button('cancelTimer',()=>{state[field]=null;save();render();$('modal').close();});}
const actions={feed(){modal('<h2>a little something to eat</h2><p>a snack for your pixel self. maybe grab something for yourself, too?</p><div class="modal-buttons"><button class="btn" id="toast">toast + jam</button><button class="btn alt" id="tea">tea + a cookie</button></div>');button('toast',()=>{$('modal').close();reward({food:25,joy:5},'toast and jam. a very good little start. ♡');});button('tea',()=>{$('modal').close();reward({food:15,joy:10},'a warm mug and something sweet. lovely. ♡');});},care(){modal('<h2>a tiny act of care</h2><p>choose a small thing for your real self, then come back and check it off.</p><div class="modal-buttons"><button class="btn" id="water">i drank some water</button><button class="btn alt" id="stretch">i stretched</button><button class="btn" id="tidy">i tidied one thing</button></div>');for(const[id,msg]of [['water','a little water. a little care. ♡'],['stretch','shoulders down. take a breath. ♡'],['tidy','one small corner, a little lighter. ♡']])button(id,()=>{$('modal').close();reward({care:20,energy:5},msg);});},play(){let points=0;playRound={target:Math.floor(Math.random()*9),turn:0};modal('<h2>find a little luck</h2><p id="gameHint">find the hidden heart! three guesses. ♡</p><div id="tiles" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"></div>');for(let i=0;i<9;i++){const b=document.createElement('button');b.className='btn';b.textContent='✦';b.setAttribute('aria-label','Try square '+(i+1));b.onclick=()=>{if(!playRound)return;b.disabled=true;playRound.turn++;if(i===playRound.target){b.textContent='♡';$('gameHint').textContent='you found it! a tiny bit of luck. ♡';reward({joy:20},'found a heart! a little play goes a long way. ♡');playRound=null;}else{b.textContent='·';if(playRound.turn>=3){$('tiles').children[playRound.target].textContent='♡';$('gameHint').textContent='there it is! thanks for playing. ♡';reward({joy:8},'a little play break. that counts, too. ♡');playRound=null;}}if(!playRound)Array.from($('tiles').children).forEach(x=>x.disabled=true);};$('tiles').append(b);}},study(){timerModal('study');},rest(){timerModal('rest');},settings(){modal('<h2>make yourself at home</h2><label for="nameInput">your name</label><input id="nameInput" maxlength="18"><label>hair color</label><div class="swatches" id="hairChoices"></div><label>sweater color</label><div class="swatches" id="outfitChoices"></div><div class="modal-buttons" style="margin-top:24px"><button class="btn" id="saveSettings">save my little self</button></div>');$('nameInput').value=state.name;let hair=state.hair,outfit=state.outfit;const group=(id,values,current,onSelect)=>{values.forEach(([color,name])=>{const b=document.createElement('button');b.className='swatch';b.style.setProperty('--swatch',color);b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',color===current);b.onclick=()=>{onSelect(color);$(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));};$(id).append(b);});};group('hairChoices',[['#76503f','brown'],['#d1a267','blonde'],['#b36d4f','auburn'],['#443e52','black']],hair,c=>hair=c);group('outfitChoices',[['#bd8cab','lavender'],['#d989a0','pink'],['#92ac87','sage'],['#93b4c3','blue']],outfit,c=>outfit=c);button('saveSettings',()=>{state.name=$('nameInput').value.trim()||'isabel';state.hair=hair;state.outfit=outfit;save();render();$('modal').close();say('a little world, a little more you. ♡');});}};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{finishTimers();actions[b.dataset.action]();});$('closeModal').onclick=()=>$('modal').close();$('modal').addEventListener('close',()=>{clearInterval(timer);playRound=null;});function tick(){const date=new Date();$('date').textContent=date.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit'});$('clock').textContent=date.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});finishTimers();}render();save();tick();setInterval(tick,1000);
})();
</script></body></html>

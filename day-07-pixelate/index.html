<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9f1e6"><title>pixelate</title><style>
@import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap');
:root{--paper:#f9f1e6;--ink:#644b57;--muted:#a08e90;--pink:#edbac8;--line:#e7d7d4;--mint:#dce8cd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px 'DM Sans',sans-serif;background-image:linear-gradient(#bf999b0b 1px,transparent 1px),linear-gradient(90deg,#bf999b0b 1px,transparent 1px);background-size:18px 18px}button,input{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,.drop:focus-visible{outline:2px solid #b77a96;outline-offset:5px}header{max-width:1200px;margin:auto;padding:27px 30px;display:flex;align-items:center;justify-content:space-between}.brand{font:23px 'Pixelify Sans',monospace;display:flex;gap:12px;align-items:center}.flower{color:#d58ca6;font-size:29px}.header-note{font-size:11px;color:var(--muted)}main{max-width:1200px;margin:35px auto 40px;padding:0 30px}.intro{margin-bottom:29px}.intro h1{font:500 clamp(43px,5.5vw,65px)/1.02 'Pixelify Sans',monospace;letter-spacing:-1px;margin:0 0 10px}.intro h1 span{color:#c2839a}.intro p{color:var(--muted);margin:0;font-size:13px}.layout{display:grid;grid-template-columns:300px 1fr;gap:25px;align-items:start}.controls{background:#fffaf2;border:1px solid var(--line);border-radius:12px;padding:23px;box-shadow:3px 4px 0 #e8dbd43b}.step-label{font:18px 'Pixelify Sans',monospace;margin:0 0 16px}.step-label span{font-size:12px;color:#bd8c9c;margin-right:7px}.upload{display:block;text-align:center;border:1px dashed #c9a4b2;border-radius:6px;padding:19px 10px;background:#faedf0;cursor:pointer;font-size:12px}.upload strong{display:block;font:21px 'Pixelify Sans',monospace;margin-bottom:5px;font-weight:400}.upload small{font-size:10px;color:#ac8795}.sample{display:block;margin:10px auto 0;font-size:10px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;background:none;border:0}.separator{border-top:1px solid var(--line);margin:23px 0}.palettes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.palette{background:#fffbf6;border:1px solid var(--line);border-radius:6px;text-align:left;padding:10px 9px;font-size:10px}.palette[aria-pressed=true]{background:#f2e7ec;border-color:#b7829c;box-shadow:inset 0 0 0 1px #b7829c}.swatches{display:flex;height:13px;margin-bottom:8px}.swatches i{flex:1}.palette span{display:block}.slider-label{font-size:11px;display:flex;justify-content:space-between;margin-bottom:13px}.slider-label output{color:#b18192}input[type=range]{width:100%;accent-color:#be8ca4;cursor:pointer;margin:0}.range-ends{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:7px}.check{display:flex;align-items:center;justify-content:space-between;font-size:11px;margin-top:21px}.check input{accent-color:#b9879f;width:15px;height:15px}.download{width:100%;margin-top:24px;background:var(--ink);color:#fff8ee;padding:13px 10px;border:1px solid var(--ink);border-radius:6px;font:18px 'Pixelify Sans',monospace;box-shadow:2px 3px 0 #d4b7c1}.download:hover{background:#7c5b6c}.workspace{min-width:0;background:#fffaf2;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:3px 4px 0 #e8dbd43b}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:16px 20px}.tabs{display:flex;background:#f1e9e2;padding:3px;border-radius:5px}.tab{padding:6px 13px;background:none;border:0;font-size:10px;border-radius:3px;color:#a48e96}.tab[aria-pressed=true]{background:#fffaf2;color:var(--ink);box-shadow:0 1px 3px #70505a10}.file-name{color:#b7a0a6;font-size:10px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;max-width:180px}.stage{height:480px;padding:25px;display:grid;place-items:center;position:relative;background-color:#f5ede5;background-image:linear-gradient(45deg,#eaddd333 25%,transparent 25%),linear-gradient(-45deg,#eaddd333 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eaddd333 75%),linear-gradient(-45deg,transparent 75%,#eaddd333 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.stage.dragover{outline:3px dashed #bb88a0;outline-offset:-12px;background-color:#f6e0e8}.stage canvas,.stage img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain;box-shadow:0 5px 20px #69495515}.stage canvas{image-rendering:pixelated}.empty{text-align:center;color:var(--muted);padding:40px 10px;cursor:pointer;background:none;border:0}.empty-art{width:72px;height:65px;display:block;margin:0 auto 23px;fill:#e9bdcc;stroke:#b48a9d;stroke-width:2;shape-rendering:crispEdges}.empty h2{font:27px 'Pixelify Sans',monospace;font-weight:400;color:#a3768d;margin:0 0 10px}.empty p{font-size:11px;margin:0;line-height:1.8}.workspace-footer{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:10px;color:var(--muted);min-height:45px;gap:15px}.status{min-height:18px;margin:17px 4px 0;color:#a5788d;font-size:11px}.privacy{text-align:center;color:#bba6aa;font-size:10px;margin:25px 0 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}@media(max-width:900px){.layout{grid-template-columns:265px 1fr;gap:18px}.controls{padding:20px}.stage{height:460px;padding:18px}.file-name{max-width:100px}}@media(max-width:670px){header{padding:22px}.header-note{display:none}main{padding:0 18px}.intro{margin-bottom:22px}.intro h1{font-size:45px}.intro p{font-size:12px}.layout{display:flex;flex-direction:column;gap:20px}.workspace{order:-1;width:100%}.controls{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px}.separator{display:none}.controls>div:first-child{grid-column:1/-1}.controls>div:last-child{grid-column:1/-1}.stage{height:350px;padding:20px}.download{margin-top:0}.step-label{font-size:17px}.file-name{max-width:100px}.status{font-size:10px}.privacy{line-height:1.7}.workspace-footer{font-size:9px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><section class="intro"><h1><span>pixelate</span></h1></section><div class="layout"><aside class="controls" aria-label="Pixel art controls"><div><h2 class="step-label"><span>01</span>your picture</h2><label class="upload" for="fileInput"><strong>+ choose a photo</strong><small>or drop it onto the canvas</small></label><input type="file" id="fileInput" class="sr" accept="image/*"><button class="sample" id="sample">try a sample instead</button></div><div class="separator"></div><div><h2 class="step-label"><span>02</span>color</h2><div class="palettes" id="palettes" role="group" aria-label="Color palette"></div></div><div class="separator"></div><div><h2 class="step-label"><span>03</span>the details</h2><label class="slider-label" for="size">pixel size<output id="sizeValue"></output></label><input type="range" id="size" min="0" max="100" value="50"><div class="range-ends"><span>fine</span><span>chunky</span></div><label class="check" for="dither">a little texture<input type="checkbox" id="dither"></label></div><div><button class="download" id="download" disabled>save my pixels ↓</button></div></aside><section class="workspace" aria-label="Photo preview"><div class="toolbar"><div class="tabs" role="group" aria-label="Preview mode"><button class="tab" id="pixelTab" aria-pressed="true">pixelated</button><button class="tab" id="originalTab" aria-pressed="false">original</button></div><span class="file-name" id="filename">no photo yet</span></div><div class="stage" id="stage"><button class="empty" id="empty"><svg class="empty-art" viewBox="0 0 72 65" aria-hidden="true"><path d="M6 6h60v48H6z" fill="#fff8e9"/><path d="M12 44 28 26l12 12 8-8 12 14v4H12z"/><path d="M47 14h8v8h-8z" fill="#e5ca8c" stroke="none"/><path d="M27 59h18"/></svg><h2>something lovely goes here</h2><p>choose a photo or drop one here<br>to give it a little pixel magic</p></button><canvas id="result" hidden aria-label="Pixelated photo preview"></canvas><img id="original" hidden alt="Original uploaded photo"></div><div class="workspace-footer"><span id="dimensions"></span><span id="paletteLabel">soft petal palette</span></div></section></div><p class="status" id="status" role="status" aria-live="polite"></p><p class="privacy">your photos stay in this browser</p></main><script src="assets/sample-data.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const palettes=[{id:'petal',name:'soft petal',colors:['#fff4d9','#ecd1b8','#dba6ad','#b97694','#8d657e','#5a465b','#c3c9a3','#8d9c86','#abbec2','#728c9b','#e8ba88','#bf8a79']},{id:'peach',name:'peach picnic',colors:['#fff2c9','#f7d996','#edb287','#df8e8e','#ba717a','#824f69','#514052','#c5d2a1','#91ad8d','#688d87','#a8c5ba','#dec7a0']},{id:'lilac',name:'lilac dream',colors:['#fff4ed','#e8d7e7','#c5b4dc','#a08ebd','#796c9b','#544d73','#dcaabb','#b27c9d','#e8ccb0','#b3cbbd','#7da5a1','#506d7b']},{id:'original',name:'original colors',colors:['#e8d2c1','#cfaab4','#a2bfa9','#91a8b9','#756778','#493e4b']}];let selected='petal',source=null,currentUrl=null,busy=false,view='pixel',generation=0,fileBase='little-photo',renderVersion=0;
const buffer=document.createElement('canvas'),ctx=buffer.getContext('2d',{willReadFrequently:true}),out=$('result'),octx=out.getContext('2d');const rgb=hex=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));const matrix=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];function quantize(data,w,colors,texture){const p=colors.map(rgb);for(let i=0;i<data.length;i+=4){if(!data[i+3])continue;const pixel=i/4,x=pixel%w,y=Math.floor(pixel/w),d=texture?(matrix[y%4][x%4]/16-.5)*28:0;const r=Math.max(0,Math.min(255,data[i]+d)),g=Math.max(0,Math.min(255,data[i+1]+d)),b=Math.max(0,Math.min(255,data[i+2]+d));let best=p[0],dist=Infinity;for(const color of p){const e=.3*(r-color[0])**2+.59*(g-color[1])**2+.11*(b-color[2])**2;if(e<dist){dist=e;best=color;}}data[i]=best[0];data[i+1]=best[1];data[i+2]=best[2];}}
function controls(){document.querySelectorAll('.palette').forEach(b=>b.setAttribute('aria-pressed',b.dataset.palette===selected));$('paletteLabel').textContent=palettes.find(p=>p.id===selected).name+(selected==='original'?'':' palette');$('dither').disabled=selected==='original';}
function show(){const has=!!source;$('empty').hidden=has;out.hidden=!has||view!=='pixel';$('original').hidden=!has||view!=='original';$('pixelTab').setAttribute('aria-pressed',view==='pixel');$('originalTab').setAttribute('aria-pressed',view==='original');}
function render(){const amount=Number($('size').value);$('sizeValue').textContent=amount<30?'tiny':amount<70?'cozy':'extra chunky';if(!source)return;const longEdge=Math.round(160*Math.pow(24/160,amount/100)),ratio=source.width/source.height;let w,h;if(ratio>=1){w=longEdge;h=Math.max(1,Math.round(w/ratio));}else{h=longEdge;w=Math.max(1,Math.round(h*ratio));}buffer.width=w;buffer.height=h;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.clearRect(0,0,w,h);ctx.drawImage(source,0,0,w,h);if(selected!=='original'){const data=ctx.getImageData(0,0,w,h);quantize(data.data,w,palettes.find(p=>p.id===selected).colors,$('dither').checked);ctx.putImageData(data,0,0);}const scale=Math.max(1,Math.floor(1280/Math.max(w,h)));out.width=w*scale;out.height=h*scale;octx.imageSmoothingEnabled=false;octx.clearRect(0,0,out.width,out.height);octx.drawImage(buffer,0,0,out.width,out.height);$('dimensions').textContent=w+' × '+h+' pixels / PNG '+out.width+' × '+out.height;$('download').disabled=false;renderVersion++;show();}
async function loadFile(file){if(!file)return;if(file.size>30*1024*1024){$('status').textContent='choose an image smaller than 30 MB';return;}const token=++generation;$('status').textContent='making room for your photo';busy=true;let url=URL.createObjectURL(file),img=new Image();img.decoding='async';try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});if(token!==generation){URL.revokeObjectURL(url);return;}if(!img.naturalWidth||img.naturalWidth*img.naturalHeight>60000000)throw new Error('large');if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=url;if(source&&typeof source.close==='function')source.close();source=img;$('original').src=url;fileBase=(file.name||'little-photo').replace(/\.[^.]+$/,'').replace(/[^\w\-]+/g,'-').slice(0,60)||'little-photo';$('filename').textContent=file.name||'your photo';view='pixel';render();$('status').textContent='a little pixel magic, just for you';}catch(error){URL.revokeObjectURL(url);if(token===generation)$('status').textContent=error.message==='large'?'this image is too large to process here, try a smaller copy':'this image could not be opened, try a JPG, PNG, or WebP';}finally{if(token===generation)busy=false;}}
for(const p of palettes){const b=document.createElement('button');b.className='palette';b.dataset.palette=p.id;b.setAttribute('aria-pressed',p.id===selected);const sw=document.createElement('div');sw.className='swatches';sw.setAttribute('aria-hidden','true');p.colors.slice(0,6).forEach(color=>{const i=document.createElement('i');i.style.background=color;sw.append(i);});const name=document.createElement('span');name.textContent=p.name;b.append(sw,name);b.onclick=()=>{selected=p.id;controls();render();};$('palettes').append(b);}
$('fileInput').onchange=()=>{loadFile($('fileInput').files[0]);$('fileInput').value='';};$('empty').onclick=()=>$('fileInput').click();$('sample').onclick=async()=>{const btn=$('sample');btn.disabled=true;try{const response=await fetch(window.PIXEL_SAMPLE);if(!response.ok)throw new Error();const blob=await response.blob();await loadFile(new File([blob],'cozy-room.png',{type:'image/png'}));}catch{$('status').textContent='sample unavailable, choose a photo to begin';}finally{btn.disabled=false;}};
let dragDepth=0;const stage=$('stage');stage.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;stage.classList.add('dragover');});stage.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});stage.addEventListener('dragleave',()=>{dragDepth--;if(dragDepth<=0){dragDepth=0;stage.classList.remove('dragover');}});stage.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;stage.classList.remove('dragover');loadFile(e.dataTransfer.files[0]);});window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());$('size').oninput=render;$('dither').onchange=render;$('pixelTab').onclick=()=>{view='pixel';show();};$('originalTab').onclick=()=>{view='original';show();};
$('download').onclick=()=>{if(!source)return;const name=fileBase+'-'+selected+'-pixels.png';const version=renderVersion;out.toBlob(blob=>{if(!blob){$('status').textContent='could not save this image, please try again';return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);$('status').textContent='your pixels are ready to keep';},'image/png');};controls();render();show();
})();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>from silicon to circuit</title><meta name="description" content="An interactive, illustrated guide to how integrated circuits are fabricated."><style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;600&display=swap');
:root{--bg:#030505;--ink:#dcebe5;--muted:#729086;--line:#1b3129;--accent:#a5f4cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px 'Share Tech Mono',monospace}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{max-width:1600px;margin:auto;padding:25px 35px 18px}.wordmark{font:500 13px Orbitron,monospace;letter-spacing:3px;color:var(--accent)}main{max-width:1600px;margin:auto;padding:0 30px 24px}.workbench{display:flex;flex-direction:column;border:1px solid var(--line);background:#060a09}.content{min-width:0}.diagram-head{display:flex;justify-content:space-between;padding:20px 24px;gap:14px}.mono{font-size:13px;letter-spacing:1px;color:var(--accent)}.view-tag{font-size:10px;color:#658176;letter-spacing:1px}.diagram{position:relative;height:clamp(330px,59vh,650px);background:radial-gradient(ellipse at center,#13312845,transparent 70%);overflow:hidden}svg.scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.scene text{font-family:'Share Tech Mono',monospace;fill:#a4c3b5}.scene .drift{animation:drift 2.8s linear infinite}.scene .scan{animation:scan 3s ease-in-out infinite}.scene .pulse{animation:pulse 2s ease-in-out infinite}@keyframes drift{from{transform:translateY(-14px);opacity:.1}50%{opacity:1}to{transform:translateY(22px);opacity:0}}@keyframes scan{50%{transform:translateX(30px)}}@keyframes pulse{50%{opacity:.35}}.legend{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;color:#8daa9d;font-size:11px;padding:18px 20px}.legend span{display:flex;align-items:center;gap:7px}.legend i{width:9px;height:9px;display:inline-block}.minimal-caption{padding:8px 24px 22px;text-align:center;min-height:55px}.minimal-caption p{margin:0;color:#bacdc3;font-size:15px;line-height:1.6}.controls{border-top:1px solid var(--line);display:flex;align-items:center;padding:15px 22px;gap:20px}.control-btn{border:1px solid #375746;background:none;padding:12px 20px;font-size:12px;letter-spacing:1px}.control-btn:hover{background:#163325}.control-btn:disabled{opacity:.25;cursor:default}.next{background:var(--accent);color:#092316;border-color:var(--accent);min-width:115px}.next:hover{background:#cbffe1}.count{margin:auto;font-size:11px;color:#6b8d7c;letter-spacing:2px}.stages{order:2;display:flex;overflow:auto;scrollbar-width:thin;scrollbar-color:#345941 #060a09;padding:10px;gap:3px;border-top:1px solid var(--line)}.step{flex:1;min-width:90px;text-align:left;display:flex;flex-direction:column;gap:8px;border:1px solid transparent;background:none;padding:10px 8px;font-size:11px;color:#638572;line-height:1.3}.step .n{font-size:12px;color:#486d56}.step[aria-current=step]{background:#10281c;border-color:#386447;color:#d4f7e1}.step[aria-current=step] .n{color:var(--accent)}.step:hover{background:#10251b}@media(min-width:1250px){.step{min-width:0}}@media(max-width:650px){header{padding:20px}main{padding:0 10px 14px}.wordmark{font-size:12px}.diagram-head{padding:17px 15px}.mono{font-size:11px}.view-tag{font-size:8px;letter-spacing:0}.diagram{height:45vh;min-height:290px}.legend{gap:13px;font-size:10px;padding:14px}.minimal-caption{padding:8px 20px 20px}.minimal-caption p{font-size:14px}.controls{padding:13px}.control-btn{padding:11px 14px;font-size:11px}.next{min-width:100px}.step{min-width:95px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header><div class="wordmark">IC FABRICATION</div></header><main><div class="workbench"><nav class="stages" aria-label="Fabrication stages" id="stages"></nav><section class="content" aria-label="Fabrication walkthrough"><div class="diagram-head"><span class="mono" id="diagramLabel"></span><span class="view-tag">SCHEMATIC / NOT TO SCALE</span></div><div class="diagram" id="diagram"></div><div class="legend" id="legend" aria-label="Material legend"></div><div class="minimal-caption" aria-live="polite"><p id="description"></p></div><div class="controls"><button class="control-btn" id="previous" aria-label="Previous fabrication stage">← BACK</button><span class="count" id="count"></span><button class="control-btn next" id="next">NEXT →</button></div></section></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const C={silicon:'#338c77',oxide:'#69aabc',resist:'#c983ac',light:'#bda2ff',metal:'#edbf67',doped:'#d38d64',ink:'#b2dfc7',paper:'#080c0e'};const data=[
['Silicon wafer','the foundation','Start with a clean canvas.','Ultra-pure silicon is grown into a single-crystal ingot, sliced into thin wafers, and polished to a very flat surface. Many copies of a circuit will be made on each wafer.','Silicon is a semiconductor: its electrical behavior can be deliberately controlled. A clean, uniform starting surface makes the later layers possible.','The circular wafer is a shared work surface. Each repeated rectangular area is a future die/not a separate chip yet.','wafer overview',['silicon']],
['Deposit a film','pattern-transfer loop / add','Lay down a thin film.','A thin material layer is deposited or grown on the wafer. In this example, an insulating film will be patterned in the following steps.','Different films can insulate, conduct, or help form a device. Thickness and uniformity matter across the wafer.','Chemical vapor deposition, physical vapor deposition, and atomic layer deposition are different ways to add films. Some insulating oxides can also be grown by oxidation.','cross-section',['silicon','oxide']],
['Coat with resist','pattern-transfer loop / prepare','Add a light-sensitive coating.','Liquid photoresist is spread into a thin coating, commonly by spinning the wafer. A bake prepares the coating for exposure.','Photoresist acts as a temporary patterning material. It lets light define which areas will be protected during a later step.','This guide uses positive-tone resist: exposed regions become more soluble during development. Negative-tone processes behave differently.','cross-section',['silicon','oxide','resist']],
['Expose a pattern','pattern-transfer loop / expose','Draw with light.','A lithography system projects a mask pattern onto the resist. The exposure changes the resist’s chemistry; it does not carve the silicon.','Lithography controls where the next manufacturing operation happens. Each new pattern must align with structures already on the wafer.','The mask and light paths here are schematic. EUV systems use reflective masks and mirrors, while other lithography systems use different optical arrangements.','cross-section',['silicon','oxide','resist','light']],
['Develop the resist','pattern-transfer loop / reveal','Wash the pattern into view.','Developer removes the exposed areas of this positive-tone resist, opening windows to the film underneath. Other resist remains in place.','The patterned resist becomes a temporary mask. Open and protected regions will respond differently in the next step.','Baking, exposure, and development are tightly controlled. The pattern must remain consistent across a wafer and align with earlier layers.','cross-section',['silicon','oxide','resist']],
['Etch the film','pattern-transfer loop / subtract','Remove what isn’t protected.','An etch removes the film through the resist openings. The protected parts remain, transferring the resist pattern into the film.','Etching turns a light-defined pattern into a physical structure. Chemistry and process conditions control which material is removed and how deeply.','Wet chemicals or plasma-based dry etches may be used. This drawing shows an idealized vertical etch that stops at the silicon; real profiles and selectivity vary.','cross-section',['silicon','oxide','resist']],
['Strip the resist','pattern-transfer loop / clean','Leave only the useful pattern.','The temporary resist is removed, leaving the patterned film. Cleaning prepares the surface for later processing.','A lithography-and-etch cycle is a way to define a feature, not to finish an entire chip. Similar cycles are repeated with many different materials and masks.','Not every pattern is used for etching. Resist can also mask an implantation step. The sequence depends on the feature being built.','cross-section',['silicon','oxide']],
['Form transistors','device fabrication / many cycles','Give silicon a switch.','Across many additional process cycles, selected regions are doped and transistor structures are formed. A gate controls conduction between source and drain.','Ion implantation can introduce dopant atoms into selected areas. Heat treatments help activate dopants and repair implantation damage.','This is a conceptual planar MOS transistor/not the direct result of the film-patterning example. Isolation, gate formation, spacers, contacts, and many other operations are condensed here.','transistor schematic',['silicon','oxide','doped','metal']],
['Connect the devices','interconnect fabrication / repeat','Build the tiny roads.','Insulating layers, metal lines, and vertical connections called vias are built above the devices. They connect individual transistors into useful circuits.','The wiring carries signals and power. Multiple metal levels let connections cross without touching.','Deposition, patterning, etching, metal fill, and chemical-mechanical polishing recur. This sketch combines them into one view; line dimensions and the number of levels vary.','interconnect schematic',['silicon','oxide','doped','metal']],
['Test the wafer','wafer probe / inspect','Find the working dies.','Electrical probes contact test pads on each die. Measurements identify which dies meet requirements before assembly.','Testing helps avoid spending assembly effort on dies that already fail. Inspection and measurement also happen throughout fabrication.','Wafer probing checks electrical behavior; other inspection tools look for defects and measure features. A good wafer-test result is not the last test a chip will face.','wafer overview',['silicon','metal']],
['Separate the dies','assembly / singulate','One wafer, many little chips.','The wafer is separated along the spaces between dies. Suitable dies are selected for assembly.','Singulation turns the shared wafer into individual pieces that can be attached to a package.','Dicing may use a saw, a laser, or another technique. Wafer thinning and the order of assembly operations depend on the package and process.','die overview',['silicon','metal']],
['Package & final test','assembly / protect / verify','Ready to join the world.','A selected die is mounted in a package and connected to external terminals. The package supports and protects it; final tests check that it works as intended.','The package connects the tiny die to a circuit board and helps manage mechanical and thermal demands.','This illustration uses a single die with schematic bond wires. Flip-chip and multi-die packages use other connection methods. The package, not just the silicon, is what you usually handle.','package schematic',['silicon','metal']]
];let index=0;const label={silicon:'silicon',oxide:'insulating film',resist:'photoresist',light:'exposure light',metal:'metal',doped:'doped region'};const rect=(x,y,w,h,fill,extra='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" ${extra}/>`;const line=(x1,y1,x2,y2,color,dash='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="1.5" ${dash?'stroke-dasharray="'+dash+'"':''}/>`;const text=(x,y,s,color='#9db9af',size=11)=>`<text x="${x}" y="${y}" fill="${color}" font-size="${size}">${s}</text>`;const substrate=()=>rect(100,211,500,66,C.silicon)+rect(100,277,500,10,'#226956')+line(100,211,600,211,'#2c755e')+text(291,253,'SILICON',C.ink,12);const film=(y=191)=>rect(100,y,500,20,C.oxide);const islands=(y,h,color)=>[100,290,480].map(x=>rect(x,y,120,h,color)).join('');
function wafer(test=false,dice=false){let out='<defs><clipPath id="waferClip"><ellipse cx="350" cy="174" rx="150" ry="123"/></clipPath></defs><ellipse cx="350" cy="182" rx="150" ry="123" fill="#89977b"/><ellipse cx="350" cy="174" rx="150" ry="123" fill="#b7c3a8"/>';out+='<g clip-path="url(#waferClip)">';for(let y=65;y<295;y+=34)for(let x=204;x<500;x+=37){out+=rect(x+(dice?(x-350)*.06:0),y+(dice?(y-174)*.06:0),dice?29:32,dice?26:29,(test&&(x+y)%4===0)?'#bb6e63':'#3d9b83','stroke="#718168" stroke-width=".6"');if(test||dice)out+=rect(x+6,y+6,20,17,'none','stroke="#e4d8ae" stroke-width=".5"');}out+='</g>';if(test)out+='<g class="scan">'+rect(360,32,110,23,'#4b6264')+[376,396,416,436].map(x=>line(x,55,x-12,114,C.ink)).join('')+'</g>'+text(490,43,'PROBE CARD');if(dice)out+=line(208,65,208,286,C.paper,'4 4')+line(196,171,506,171,C.paper,'4 4')+text(487,284,'DIES');else out+=text(291,326,test?'TEST & MAP':'SINGLE-CRYSTAL WAFER');return out;}
function diagram(stage=index){const index=stage;let out='';if(index===0)out=wafer();else if(index===9)out=wafer(true);else if(index===10)out=wafer(false,true);else if(index===11){out+=rect(155,246,390,26,'#827a6b')+rect(170,220,360,26,'#a8b59a')+rect(280,185,140,34,C.silicon)+rect(280,179,140,6,C.metal);for(let i=0;i<6;i++){let x=180+i*60;out+=rect(x,272,22,8,C.metal);out+=`<path d="M${x+11} 224 Q${x+11} 125 ${290+i*22} 180" fill="none" stroke="${C.metal}" stroke-width="2"/>`;}out+=rect(177,128,346,90,'#e3ddd1','fill-opacity=".36" stroke="#c0bcaf" stroke-dasharray="5 4" rx="10"')+text(539,152,'ENCAPSULATION')+line(522,148,535,148,'#c0bcaf')+text(446,197,'DIE')+text(268,314,'PACKAGE SUBSTRATE');}else{out+=substrate();if(index<=6){if(index<5)out+=film();else out+=islands(191,20,C.oxide);if(index===2||index===3)out+=rect(100,170,500,21,C.resist);if(index===3){out+=rect(100,55,500,8,'#788b89');out+=rect(222,54,56,10,C.paper)+rect(412,54,56,10,C.paper);[250,440].forEach(x=>out+=rect(x-28,65,56,107,C.light,'fill-opacity=".28" class="pulse"')+line(x,78,x,155,C.light,'3 5'));out+=text(108,37,'SCHEMATIC MASK')+text(235,135,'↓',C.light,18)+text(425,135,'↓',C.light,18);out+=text(113,311,'LIGHT CHANGES RESIST CHEMISTRY');}if(index===4||index===5)out+=islands(170,21,C.resist);if(index===4)out+=text(233,151,'OPEN',C.ink,10)+text(423,151,'OPEN',C.ink,10);if(index===5){[240,260,430,450].forEach((x,i)=>out+=`<g class="drift" style="animation-delay:${i*.3}s">`+line(x,95,x,148,'#edbf67')+text(x-4,160,'↓','#edbf67',15)+'</g>');out+=text(245,72,'ETCH THROUGH OPENINGS');}if(index===1)out+=text(284,145,'ADD A FILM')+[160,260,360,460,560].map((x,i)=>`<path d="M${x} 145v15m-3-4 3 4 3-4" stroke="${C.oxide}" fill="none" class="drift" style="animation-delay:${i*.4}s"/>`).join('');if(index===2)out+=text(240,135,'CONTINUOUS RESIST COATING');if(index===6)out+=text(242,149,'PATTERNED FILM REMAINS');}
else{out+=rect(100,192,500,19,C.oxide)+rect(204,211,95,23,C.doped)+rect(401,211,95,23,C.doped)+rect(303,182,94,10,'#eee7cc')+rect(303,150,94,32,C.metal);out+=text(216,252,'SOURCE',C.ink,10)+text(416,252,'DRAIN',C.ink,10);if(index===7){out+=text(325,135,'GATE',C.ink)+line(350,137,350,150,C.ink)+text(306,313,'CHANNEL BELOW GATE',C.ink,10);out+=line(306,228,396,228,'#6c8670','3 4');}if(index===8){out+=rect(100,67,500,125,C.oxide,'fill-opacity=".8"');out+=rect(235,120,22,91,C.metal)+rect(446,120,22,91,C.metal)+rect(337,83,22,67,C.metal)+rect(200,116,90,14,C.metal)+rect(404,116,110,14,C.metal)+rect(235,65,22,51,C.metal)+rect(446,65,22,51,C.metal)+rect(160,50,150,15,C.metal)+rect(337,76,150,14,C.metal);out+=text(110,33,'METAL LINES')+text(527,109,'VIAS')+line(475,114,521,105,C.ink);}}
}return `<svg class="scene" viewBox="0 0 700 350" role="img" aria-label="${data[index][0]}: ${data[index][3]}">${out}</svg>`;}
const descriptions=[
'Start with a polished silicon wafer',
'Add a thin insulating film',
'Coat the surface with light-sensitive photoresist',
'Light changes the resist through openings in the mask',
'Developer removes the exposed resist to reveal a pattern',
'Etch the exposed film while the resist protects the rest',
'Remove the resist to leave the patterned film',
'Many more cycles form doped regions and transistor gates',
'Stack metal lines and vias to connect the transistors',
'Probe each die to check its electrical behavior',
'Cut the wafer into individual dies',
'Mount and connect a die in a package, then run final tests'
];
function render(){const d=data[index];$('diagram').innerHTML=diagram(index);$('diagramLabel').textContent=String(index+1).padStart(2,'0')+' / '+d[0].toUpperCase();$('description').textContent=descriptions[index];$('legend').replaceChildren();d[7].forEach(k=>{let s=document.createElement('span'),i=document.createElement('i');i.style.background=C[k];s.append(i,document.createTextNode(label[k]));$('legend').append(s);});$('count').textContent=String(index+1).padStart(2,'0')+' / 12';$('previous').disabled=index===0;$('next').textContent=index===11?'RESTART ↺':'NEXT →';document.querySelectorAll('.step').forEach((b,i)=>{if(i===index)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});}
function go(i){index=i;render();const active=document.querySelector('.step[aria-current]');if(active)$('stages').scrollTo({left:active.offsetLeft-$('stages').offsetLeft-12,behavior:'smooth'});}
data.forEach((d,i)=>{const b=document.createElement('button');b.className='step';b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+d[0]+'</span>';b.onclick=()=>go(i);$('stages').append(b);});$('previous').onclick=()=>go(Math.max(0,index-1));$('next').onclick=()=>go((index+1)%12);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go((index+1)%12);}if(e.key==='ArrowLeft'){e.preventDefault();go(Math.max(0,index-1));}});render();
})();
</script></body></html>

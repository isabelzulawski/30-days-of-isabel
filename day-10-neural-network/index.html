<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neural network</title><meta name="description" content="A visual walkthrough of a small neural network and one training update"><style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;600&display=swap');
:root{--bg:#030505;--ink:#dcebe5;--muted:#729086;--line:#1b3129;--accent:#a5f4cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px 'Share Tech Mono',monospace}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{max-width:1600px;margin:auto;padding:25px 35px 18px}.wordmark{font:500 13px Orbitron,monospace;letter-spacing:3px;color:var(--accent)}main{max-width:1600px;margin:auto;padding:0 30px 24px}.workbench{display:flex;flex-direction:column;border:1px solid var(--line);background:#060a09}.content{min-width:0}.diagram-head{display:flex;justify-content:space-between;padding:20px 24px;gap:14px}.mono{font-size:13px;letter-spacing:1px;color:var(--accent)}.view-tag{font-size:10px;color:#658176;letter-spacing:1px}.diagram{position:relative;height:clamp(350px,59vh,650px);background:radial-gradient(ellipse at center,#13312845,transparent 70%);overflow:hidden}svg.scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.scene text{font-family:'Share Tech Mono',monospace;fill:#a4c3b5}.scene .drift{animation:drift 2.8s linear infinite}.scene .scan{animation:scan 3s ease-in-out infinite}.scene .pulse{animation:pulse 2s ease-in-out infinite}@keyframes drift{from{transform:translateY(-14px);opacity:.1}50%{opacity:1}to{transform:translateY(22px);opacity:0}}@keyframes scan{50%{transform:translateX(30px)}}@keyframes pulse{50%{opacity:.35}}.legend{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;color:#8daa9d;font-size:11px;padding:18px 20px}.legend span{display:flex;align-items:center;gap:7px}.legend i{width:9px;height:9px;display:inline-block}.minimal-caption{padding:8px 24px 22px;text-align:center;min-height:55px}.minimal-caption p{margin:0;color:#bacdc3;font-size:15px;line-height:1.6}.controls{border-top:1px solid var(--line);display:flex;align-items:center;padding:15px 22px;gap:20px}.control-btn{border:1px solid #375746;background:none;padding:12px 20px;font-size:12px;letter-spacing:1px}.control-btn:hover{background:#163325}.control-btn:disabled{opacity:.25;cursor:default}.next{background:var(--accent);color:#092316;border-color:var(--accent);min-width:115px}.next:hover{background:#cbffe1}.count{margin:auto;font-size:11px;color:#6b8d7c;letter-spacing:2px}.stages{order:2;display:flex;overflow:auto;scrollbar-width:thin;scrollbar-color:#345941 #060a09;padding:10px;gap:3px;border-top:1px solid var(--line)}.step{flex:1;min-width:90px;text-align:left;display:flex;flex-direction:column;gap:8px;border:1px solid transparent;background:none;padding:10px 8px;font-size:11px;color:#638572;line-height:1.3}.step .n{font-size:12px;color:#486d56}.step[aria-current=step]{background:#10281c;border-color:#386447;color:#d4f7e1}.step[aria-current=step] .n{color:var(--accent)}.step:hover{background:#10251b}@media(min-width:1250px){.step{min-width:0}}@media(max-width:650px){header{padding:20px}main{padding:0 10px 14px}.wordmark{font-size:12px}.diagram-head{padding:17px 15px}.mono{font-size:11px}.view-tag{font-size:8px;letter-spacing:0}.diagram{height:45vh;min-height:290px}.legend{gap:13px;font-size:10px;padding:14px}.minimal-caption{padding:8px 20px 20px}.minimal-caption p{font-size:14px}.controls{padding:13px}.control-btn{padding:11px 14px;font-size:11px}.next{min-width:100px}.step{min-width:95px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body><header><div class="wordmark">NEURAL NETWORK</div></header><main><div class="workbench"><nav class="stages" aria-label="Network stages" id="stages"></nav><section class="content" aria-label="Neural network walkthrough"><div class="diagram-head"><span class="mono" id="diagramLabel"></span><span class="view-tag">2 INPUTS / 3 HIDDEN UNITS / 1 OUTPUT</span></div><div class="diagram" id="diagram"></div><div class="legend" id="legend" aria-label="Connection legend"><span><i style="background:#a5f4cc"></i>positive weight</span><span><i style="background:#c983ac"></i>negative weight</span></div><div class="minimal-caption" aria-live="polite"><p id="description"></p></div><div class="controls"><button class="control-btn" id="previous" aria-label="Previous network stage">← BACK</button><span class="count" id="count"></span><button class="control-btn next" id="next">NEXT →</button></div></section></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),green='#a5f4cc',pink='#c983ac',muted='#638572',blue='#69aabc',gold='#edbf67';let index=0;
const x=[.8,.3],target=1,W=[[.6,-.4],[-.2,.8],[.3,.5]],b=[-.1,.1,-.2],v=[-.4,.2,.1],bo=-.15,rate=.5;
const sigmoid=z=>1/(1+Math.exp(-z));function forward(w,bs,vo,bias){const z=w.map((r,j)=>r.reduce((s,a,i)=>s+a*x[i],bs[j])),h=z.map(sigmoid),out=h.reduce((s,a,j)=>s+a*vo[j],bias),p=sigmoid(out);return{z,h,out,p,loss:-Math.log(p)};}
const before=forward(W,b,v,bo),delta=before.p-target,dh=before.h.map((a,j)=>delta*v[j]*a*(1-a)),gradW=W.map((r,j)=>r.map((_,i)=>dh[j]*x[i])),gradV=v.map((_,j)=>delta*before.h[j]);const afterW=W.map((r,j)=>r.map((a,i)=>a-rate*gradW[j][i])),afterB=b.map((a,j)=>a-rate*dh[j]),afterV=v.map((a,j)=>a-rate*gradV[j]),afterBo=bo-rate*delta,after=forward(afterW,afterB,afterV,afterBo);
const stages=[['Input','Turn one example into numbers'],['Weights','Each connection scales its input by a learned weight'],['Sum','Each hidden unit adds its weighted inputs and a bias'],['Activation','A nonlinear function turns each sum into an activation'],['Prediction','The output combines hidden activations into a probability'],['Loss','Compare the prediction with the known target'],['Backpropagation','Compute how each weight and bias affects the loss'],['Update','Take one small step opposite the gradient to reduce this example’s loss']];
const fmt=n=>(Math.abs(n)<.0005?0:n).toFixed(2),sign=n=>(n>=0?'+':'')+fmt(n),pct=n=>Math.round(n*100)+'%';
const text=(x,y,s,color=muted,size=12,anchor='middle')=>`<text x="${x}" y="${y}" fill="${color}" style="fill:${color}" font-size="${size}" text-anchor="${anchor}">${s}</text>`;
const box=(x,y,w,h,color,opacity=1)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}" fill-opacity="${opacity}"/>`;
function node(x,y,value,label,color,active=true){return box(x-28,y-22,56,44,'#0c1b15')+`<rect x="${x-28}" y="${y-22}" width="56" height="44" fill="${color}" fill-opacity="${active?.12:0}" stroke="${active?color:'#294236'}"/>`+text(x,y+5,value,active?color:muted,15)+text(x,y+39,label,muted,10);}
const positions={input:[[100,145],[100,265]],hidden:[[380,95],[380,205],[380,315]],output:[[660,205]]};
function edge(a,z,w,active,reverse=false){const color=w>=0?green:pink,width=1+Math.abs(w)*2;let out=`<path d="M${a[0]+28} ${a[1]} L${z[0]-28} ${z[1]}" stroke="${color}" stroke-opacity="${active?.65:.12}" stroke-width="${width}" fill="none"/>`;if(active){const from=reverse?[z[0]-28,z[1]]:[a[0]+28,a[1]],to=reverse?[a[0]+28,a[1]]:[z[0]-28,z[1]];out+=`<rect width="5" height="5" x="-2.5" y="-2.5" fill="${reverse?gold:color}"><animateMotion dur="2.5s" repeatCount="indefinite" path="M${from[0]} ${from[1]} L${to[0]} ${to[1]}"/></rect>`;}return out;}
function draw(){const updated=index===7,w=updated?afterW:W,vo=updated?afterV:v,calc=updated?after:before;let out='';out+=text(100,33,'INPUT',muted,11)+text(380,33,'HIDDEN LAYER',muted,11)+text(660,33,'OUTPUT',muted,11);
for(let j=0;j<3;j++)for(let i=0;i<2;i++)out+=edge(positions.input[i],positions.hidden[j],w[j][i],index===1||index===2||index===6||index===7,index===6);
for(let j=0;j<3;j++)out+=edge(positions.hidden[j],positions.output[0],vo[j],index===4||index===6||index===7,index===6);
positions.input.forEach(([a,z],i)=>out+=node(a,z,fmt(x[i]),'x'+(i+1),blue));positions.hidden.forEach(([a,z],j)=>out+=node(a,z,index<2?'?':index===2?fmt(calc.z[j]):fmt(calc.h[j]),index===2?'sum z'+(j+1):'h'+(j+1),green,index>=2));out+=node(660,205,index>=4?pct(calc.p):'?',index>=4?'P(class 1)':'prediction',green,index>=4);
if(index===0){out+=text(100,365,'ONE TRAINING EXAMPLE',blue,11)+text(380,393,'Values travel from left to right',muted,12);}
if(index===1){for(let j=0;j<3;j++)for(let i=0;i<2;i++){const a=positions.input[i],z=positions.hidden[j];out+=text(a[0]+100+(j%2)*38,a[1]+(z[1]-a[1])*.4-8,sign(w[j][i]),w[j][i]>=0?green:pink,11);}out+=text(380,397,'Thicker lines carry larger absolute weights',muted,12);}
if(index===2){out+=text(380,388,'z1 = 0.80 × 0.60 + 0.30 × (−0.40) − 0.10',green,12)+text(380,409,'z1 = '+fmt(before.z[0]),green,12);}
if(index===3){out+=text(380,390,'sigmoid(z) = 1 / (1 + exp(−z))',green,13)+text(380,411,'Nonlinearity lets layers model more complex relationships',muted,11);}
if(index===4){out+=text(660,280,'CLASS 1',green,10)+text(660,301,pct(calc.p),green,22)+text(660,331,'CLASS 0  '+pct(1-calc.p),muted,11)+text(380,399,'The output uses a weighted sum, bias, and sigmoid too',muted,12);}
if(index===5){out+=text(660,280,'KNOWN TARGET',gold,10)+text(660,305,'1',gold,23)+text(380,390,'LOSS = −ln(P(class 1)) = '+fmt(before.loss),gold,14)+text(380,411,'Binary cross-entropy for this example with target 1',muted,11);}
if(index===6){out+=text(380,385,'OUTPUT → HIDDEN → PARAMETERS',gold,13)+text(380,409,'∂loss / ∂output bias = '+sign(delta),gold,12);}
if(index===7){out+=text(660,280,'BEFORE → AFTER',green,10)+text(660,307,pct(before.p)+' → '+pct(after.p),green,18)+text(380,385,'parameter = parameter − learning rate × gradient',green,12)+text(380,411,'LOSS '+fmt(before.loss)+' → '+fmt(after.loss)+'    /    RATE '+fmt(rate),gold,12);}
return `<svg class="scene" viewBox="0 0 760 440" role="img" aria-label="${stages[index][0]} ${stages[index][1]}">${out}</svg>`;}
function render(){$('diagramLabel').textContent=String(index+1).padStart(2,'0')+' / '+stages[index][0].toUpperCase();$('diagram').innerHTML=draw();$('description').textContent=stages[index][1];$('count').textContent=String(index+1).padStart(2,'0')+' / 08';$('previous').disabled=index===0;$('next').textContent=index===7?'RESTART ↺':'NEXT →';document.querySelectorAll('.step').forEach((el,i)=>{if(i===index)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});if(matchMedia('(prefers-reduced-motion: reduce)').matches)$('diagram').querySelectorAll('animateMotion').forEach(el=>el.remove());}
function go(n){index=n;render();const active=document.querySelector('.step[aria-current]');if(active)$('stages').scrollTo({left:active.offsetLeft-$('stages').offsetLeft-12,behavior:'smooth'});}
stages.forEach(([name],i)=>{const el=document.createElement('button');el.className='step';el.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+name+'</span>';el.onclick=()=>go(i);$('stages').append(el);});$('next').onclick=()=>go((index+1)%8);$('previous').onclick=()=>go(Math.max(0,index-1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go((index+1)%8);}if(e.key==='ArrowLeft'){e.preventDefault();go(Math.max(0,index-1));}});render();
})();
</script></body></html>

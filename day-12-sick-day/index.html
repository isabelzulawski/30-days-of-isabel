<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355c50"><title>Sick Day</title><meta name="description" content="A tiny pixel-art adventure about making it through a rainy sick day in NYC."><style>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf5f3"><title>pixel art</title><meta name="description" content="A small pixel drawing studio. Pick a color, make a tiny thing, and save it."><style>
*{box-sizing:border-box}body{margin:0;background:#faf5f3;color:#72565d;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}button,input{font:inherit;color:inherit}button{cursor:pointer}main{max-width:760px;margin:auto;padding:27px 25px 35px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:21px;letter-spacing:-1px;font-weight:500;margin:0;color:#b86f89}.mark{display:grid;grid-template-columns:repeat(3,5px);gap:2px;transform:rotate(-8deg)}.mark i{height:5px;background:#d29aab}.mark i:nth-child(2),.mark i:nth-child(4),.mark i:nth-child(6){background:#ead6da}.workspace{max-width:510px;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px}.sizes{display:flex;gap:4px}.quiet{border:0;background:none;padding:7px 10px;color:#ac9198;font-size:11px}.sizes button{border:1px solid transparent;background:transparent;padding:5px 10px;border-radius:5px;color:#b19a9f;font-size:11px}.sizes button[aria-pressed=true]{background:#f3e5e8;color:#a2677c;border-color:#e4cbd3}.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px}.toolset,.history{display:flex;gap:5px}.tool{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:none;padding:7px 11px;border-radius:5px;color:#a48790;font-size:11px}.tool[aria-pressed=true]{background:#fffdfb;border-color:#d6b8c3;color:#975c73;box-shadow:0 2px 0 #eadbdf}.tool svg,.icon svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.icon{display:grid;place-items:center;background:none;border:0;padding:7px;color:#a1818e}.icon:disabled{opacity:.25;cursor:default}.frame{padding:11px;background:#fffdfb;border:1px solid #d9c7ce;box-shadow:4px 5px 0 #eddee3}.canvas-wrap{position:relative;aspect-ratio:1;background:#f5eded}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair;outline:none}canvas:focus-visible{outline:2px solid #ae7e95;outline-offset:3px}.below{display:flex;justify-content:space-between;margin-top:14px;font-size:10px;color:#b4a0a7;min-height:18px}.palettes{display:flex;justify-content:center;gap:18px;margin:23px 0 14px}.palettes button{border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;color:#b39ba6;font-size:10px}.palettes button[aria-pressed=true]{color:#9d6680;border-bottom-color:#bf8ca4}.colors{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:32px}.swatch{width:25px;height:25px;background:var(--color);border:1px solid #0000000a;padding:0;border-radius:3px;position:relative}.swatch[aria-pressed=true]:after{content:'';position:absolute;inset:-4px;border:1px solid #a88798;border-radius:5px}.custom{position:relative;width:27px;height:27px;border:1px dashed #c6afb9;display:grid;place-items:center;color:#ad8697;font-size:18px;cursor:pointer;border-radius:4px}.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:29px}.download{border:1px solid #c591a7;background:#e9cad7;color:#82536b;padding:10px 20px;border-radius:5px;box-shadow:0 3px 0 #dcc0cb;font-size:11px}.download:hover{background:#e2bacb}.clear{background:none;border:0;color:#b09aa4;padding:7px 0;font-size:10px}.hint{text-align:center;margin:30px 0 0;color:#b7a8ad;font-size:10px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}button:focus-visible,input:focus-visible{outline:2px solid #ab7c94;outline-offset:4px}@media(max-width:550px){main{padding:20px 19px}header{margin-bottom:25px}h1{font-size:19px}.tool{padding:7px 8px;font-size:10px;gap:4px}.tool svg{width:15px}.colors{gap:10px}.swatch{width:25px;height:25px}.palettes{margin-top:22px;gap:22px}.frame{padding:8px}.hint{font-size:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><header><h1>pixel art</h1><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></header><section class="workspace" aria-label="pixel drawing studio"><div class="topline"><div class="sizes" aria-label="canvas size"><button data-size="16" aria-pressed="true">16 × 16</button><button data-size="32" aria-pressed="false">32 × 32</button></div><button class="quiet" id="grid" aria-pressed="true">grid on</button></div><div class="tools"><div class="toolset" aria-label="drawing tools"><button class="tool" data-tool="pencil" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 12-12 4 4L8 20l-5 1Zm10-10 4 4M4 16l4 4"/></svg>pencil</button><button class="tool" data-tool="fill" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 6 9-2 7 8-9 9-10-9Zm1-4 8 10M3 12h17"/></svg>fill</button><button class="tool" data-tool="eraser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 14 10-11 8 8-9 10H9Zm4-5 9 8m-5 4h10"/></svg>erase</button></div><div class="history"><button class="icon" id="undo" aria-label="undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 3 10l5 5M3 10h11a6 6 0 0 1 0 12"/></svg></button><button class="icon" id="redo" aria-label="redo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12"/></svg></button></div></div><div class="frame"><div class="canvas-wrap"><canvas id="canvas" width="512" height="512" tabindex="0" aria-label="Pixel drawing canvas. Click or drag to draw. Keyboard: arrow keys move, Space draws, P pencil, F fill, E eraser." aria-describedby="keyboard"></canvas></div></div><div class="below"><span id="info">16 × 16 pixels</span><span id="saved" role="status" aria-live="polite">a blank little canvas</span></div><div class="palettes" aria-label="color palettes"><button data-palette="soft" aria-pressed="true">soft</button><button data-palette="autumn" aria-pressed="false">autumn</button><button data-palette="game boy" aria-pressed="false">game boy</button></div><div class="colors" id="colors" aria-label="colors"></div><div class="bottom"><button class="clear" id="clear">clear canvas</button><button class="download" id="download">download png ↗</button></div><p class="hint">pick a color. make something small.</p><p class="sr" id="keyboard">Arrow keys move the selected pixel. Space draws with the selected tool. Control or Command Z undoes. Shift Z redoes.</p><a id="export" hidden></a></section></main><script src="pixels.js"></script><script src="studio.js"></script></body></html>

const a=points[j-1],b=points[j],dx=b[0]-a[0],dy=b[1]-a[1],length=Math.hypot(dx,dy);if(length<180)continue;const trim=Math.min(105,length*.25),ux=dx/length,uy=dy/length;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${a[0]+ux*trim} ${a[1]+uy*trim} L${b[0]-ux*trim} ${b[1]-uy*trim}`);svg.append(path)}}async function restorePhotos(){for(const e of Object.values(entries)){if(e.imageId)try{const blob=await getPhoto(e.imageId);if(blob)photoURLs.set(e.imageId,URL.createObjectURL(blob))}catch{}}draw()}function reset(){scale=innerWidth<600?.47:innerWidth<1000?.65:.85;x=innerWidth/2-1230*scale;y=innerHeight/2-930*scale;transform()}let down=false,moved=false,sx,sy,ox,oy;vp.onpointerdown=e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;ox=x;oy=y};window.addEventListener('pointermove',e=>{if(!down)return;if(Math.hypot(e.clientX-sx,e.clientY-sy)>6){moved=true;vp.classList.add('dragging');x=ox+e.clientX-sx;y=oy+e.clientY-sy;transform()}});window.addEventListener('pointerup',()=>{down=false;vp.classList.remove('dragging')});window.addEventListener('pointercancel',()=>{down=false;vp.classList.remove('dragging')});function zoom(f){const old=scale;scale=Math.max(.35,Math.min(1.8,scale*f));x=innerWidth/2-(innerWidth/2-x)*scale/old;y=innerHeight/2-(innerHeight/2-y)*scale/old;transform()}$('#plus').onclick=()=>zoom(1.2);$('#minus').onclick=()=>zoom(1/1.2);$('#reset').onclick=reset;vp.onwheel=e=>{e.preventDefault();if(e.ctrlKey)zoom(e.deltaY<0?1.05:1/1.05);else{x-=e.deltaX;y-=e.deltaY;transform()}};vp.addEventListener('wheel',vp.onwheel,{passive:false});document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||$('#index').classList.contains('visible'))return;const shifts={ArrowLeft:[60,0],ArrowRight:[-60,0],ArrowUp:[0,60],ArrowDown:[0,-60]};if(shifts[e.key]){e.preventDefault();x+=shifts[e.key][0];y+=shifts[e.key][1];transform()}});$('#fieldBtn').onclick=()=>{$('#index').classList.remove('visible');$('#fieldBtn').
